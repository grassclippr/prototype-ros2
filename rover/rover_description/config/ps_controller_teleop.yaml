teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 7
    enable_turbo_button: 5

    # These indices are a reasonable starting point for Playstation-style
    # controllers, but may differ between USB and Bluetooth on a given host.
    axis_linear:
      x: 1
    axis_angular:
      yaw: 0

    scale_linear:
      x: 0.10
    scale_linear_turbo:
      x: 0.20

    scale_angular:
      yaw: 0.50
    scale_angular_turbo:
      yaw: 0.80
